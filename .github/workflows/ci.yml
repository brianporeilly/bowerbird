name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match `rust-version` in the workspace Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  static:
    name: static musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # rusqlite's bundled SQLite compiles C, so the musl target needs a C
      # cross-compiler. musl-tools installs it as `musl-gcc`, but cc-rs looks
      # for `x86_64-linux-musl-gcc` first and fails before trying the fallback.
      #
      # CC_ only. Setting CARGO_TARGET_..._LINKER as well makes musl-gcc the
      # linker driver, which links against /lib/ld-musl-x86_64.so.1 and silently
      # costs us the static binary. rustc's own self-contained linking is what
      # produces static-pie, so leave it alone.
      - run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - name: confirm the binary is actually static
        # `ldd` is not sufficient: a musl-dynamic binary with no shared library
        # dependencies still reports "statically linked", so grepping for `=>`
        # passes on a binary that needs an interpreter at runtime. The load-
        # bearing check is the absence of a PT_INTERP header. Running it is the
        # proof: this runner has no musl loader.
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/bower
          file "$BIN"
          if readelf -l "$BIN" | grep -q INTERP; then
            echo "::error::binary requires a dynamic interpreter; it is not static"
            readelf -l "$BIN" | grep -A1 INTERP
            exit 1
          fi
          "$BIN" --version

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
