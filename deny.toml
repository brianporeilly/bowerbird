# cargo-deny: supply-chain gates. A tool that moves people's files should not
# pick up dependencies nobody looked at.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only, matching this project's own MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots only. This is the Mozilla CA root set, and CDLA-Permissive-2.0
    # is a permissive *data* licence: no copyleft, no attribution requirement
    # beyond keeping the disclaimer. Bundling the roots rather than reading the
    # host trust store is what lets the static binary do TLS on a distroless
    # image that has no CA store at all, which ADR-0001 §1 asks for.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
