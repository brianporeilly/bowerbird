[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brianporeilly/bowerbird"
authors = ["Brian O'Reilly"]

[workspace.dependencies]
bower-config = { path = "crates/bower-config", version = "0.1.0" }
bower-core = { path = "crates/bower-core", version = "0.1.0" }
bower-llm = { path = "crates/bower-llm", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The whole point of this tool is that dangerous operations are hard to reach.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
