[package]
name = "bower-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bowerbird CLI (bower): LLM-assisted file organization."

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bower-config = { version = "0.1.0", path = "../bower-config" }
bower-core = { version = "0.1.0", path = "../bower-core" }
bower-llm = { version = "0.1.0", path = "../bower-llm" }
clap = { version = "4.6.6", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "bower"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
