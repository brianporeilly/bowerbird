[package]
name = "bower-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core pipeline for Bowerbird: scanner, policy engine, executor, journal."

[lints]
workspace = true

[dependencies]
bower-config = { version = "0.1.0", path = "../bower-config" }
globset = "0.4.20"
hex = "0.4.3"
infer = "0.22.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
tracing = "0.1.44"
walkdir = "2.5.0"

[dev-dependencies]
proptest = "1.11.0"
rusqlite = "0.40.2"
serde_json = "1.0.151"
tempfile = "3.27.0"
