# Bowerbird example configuration.
#
# Copy to `bowerbird.toml`, `~/.config/bowerbird/config.toml`, or
# `/etc/bowerbird/config.toml` -- those are searched in that order -- or pass
# `--config PATH`.
#
# Validate a config without running anything:
#
#     bower config check
#
# Unknown keys are a hard error, not a warning. A typo in a file that governs
# where your files end up should not be something you discover later.

config_version = 1

[general]
# Ship safe. With dry_run = true, `bower run` prints the plan and writes
# nothing; `bower run --execute` overrides it for a single run.
dry_run = true

# One SQLite file holds both the append-only journal of executed actions and
# the mutable review queue.
state_path = "/var/lib/bowerbird/state.db"

# One lock file per profile, so schedules for different directories never block
# each other.
lock_file_dir = "/var/lib/bowerbird/locks"

log_level = "info"
default_batch_size = 25
default_confidence_threshold = 0.75

# "in_place" leaves items awaiting review where they are. "quarantine" moves
# them to quarantine_dir so they can be browsed without the CLI.
review_placement = "in_place"
quarantine_dir = "/data/_review"

# Where approved deletions go. Required only if some profile sets
# allow_delete_suggestions = true. Nothing here is destroyed until you run
# `bower recycle purge`.
# recycle_dir = "/data/_recycled"


# --- Backends -----------------------------------------------------------------
# Secrets are read from the environment, never stored here. `api_key_env` names
# the variable; omit it for an unauthenticated local endpoint.

[[llm_backends]]
name = "local-llama"
provider = "openai_compatible"
endpoint = "http://localhost:8080/v1"
api_key_env = ""
model = "llama-3.1-8b-instruct"
# Generous because a self-hosted model is measured in seconds per file, not
# milliseconds: a small quantized model can take 15s each, so a batch of 25 is
# minutes of work. The batch size on the profile is the thing to tune first --
# each request carries its own timeout budget, so smaller batches turn a hard
# failure into a slower run.
timeout_secs = 300
max_retries = 2

# How this endpoint is asked to return JSON. Per backend, because one install
# routinely talks to both a cloud API and a local server.
#
#   "prompt"       (default) Ask for JSON in the prompt and parse the reply.
#                  Sends no `response_format`, so it works against anything.
#   "json_object"  response_format: {"type": "json_object"}. Supported by
#                  recent llama.cpp, Ollama, vLLM, and the OpenAI API.
#   "json_schema"  A strict schema. The most reliable where supported.
#
# The default is the weakest on purpose: an endpoint that does not recognise
# `response_format` usually rejects the whole request, so a stronger default
# would fail on first contact with exactly the self-hosted servers this tool
# targets. Raise it once you know what your server supports -- it measurably
# reduces how often a batch needs the reformat retry.
structured_output = "prompt"

[[llm_backends]]
name = "anthropic-cloud"
provider = "anthropic_compatible"
endpoint = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-haiku-4-5"
# A cloud API answers in well under a second per file, so the local backend's
# 300 would only delay reporting a genuinely dead endpoint.
timeout_secs = 30
max_retries = 2
structured_output = "json_schema"


# --- Profiles -----------------------------------------------------------------

# Organizing in place: files are sorted into category subdirectories of the
# directory they are already in, because `destination_root` is omitted.
#
# You are NOT required to organize in place. Setting destination_root to a
# different directory -- as `personal-docs` below does -- is equally supported
# and often preferable: it keeps the source directory a pure inbox.
[[profiles]]
name = "downloads"
path = "/data/downloads"
description = "General downloads folder. Mixed file types, no fixed structure expected."
enabled = true
llm_backend = "local-llama"
categories = ["Documents", "Images", "Installers", "Archives", "Media"]
allow_dynamic_categories = true

# Off by default. A deletion suggestion can never execute on its own -- it
# always lands in the review queue, whatever its confidence -- but on most
# profiles the question is not worth asking at all.
allow_delete_suggestions = false

# Files per request. Lower this before raising timeout_secs: a local model
# answering at 15s per file needs several minutes for a batch of 25, and one
# slow batch fails every file in it.
batch_size = 8
# Below this, a file goes to review instead of being filed. Worth knowing: this
# relies on the model reporting its own confidence honestly, and small models
# measured so far do not -- a 3B returned 0.85-0.99 on everything, including
# files it got wrong. The deterministic checks are what hold; this is a hint.
confidence_threshold = 0.7

# skip | suffix | quarantine. Bowerbird never overwrites, whichever you pick.
on_conflict = "quarantine"

# Ignore anything modified in the last 15 minutes; a file still downloading is
# not a file worth classifying. Note that this also means a file you just
# created will be reported as "still settling" -- set it to 0 while trying
# things out.
stability_wait_minutes = 15

exclude_patterns = ["*.part", "*.crdownload", ".DS_Store"]
include_subdirs = false

[profiles.rename]
enabled = false

[profiles.metadata]
detect_mime = true
extract_exif = false
extract_audio_tags = false
extract_pdf_metadata = false
content_sniff_bytes = 0


# Routing elsewhere: the inbox stays empty, organized output lands under a
# separate root.
[[profiles]]
name = "personal-docs"
path = "/data/documents/inbox"
description = "Scanned personal documents: invoices, tax records, medical, insurance."
enabled = true
llm_backend = "anthropic-cloud"
destination_root = "/data/documents/organized"
categories = ["Invoices", "Tax", "Medical", "Insurance", "Legal"]

# A fixed taxonomy: the model may not invent a category here.
allow_dynamic_categories = false

# Sensitive documents: never ask the deletion question.
allow_delete_suggestions = false

confidence_threshold = 0.85
on_conflict = "quarantine"

[profiles.rename]
enabled = true
# `{ext}` and `{date}` are filled by Bowerbird from the file itself -- the
# extension including the dot, and the mtime as YYYY-MM-DD in *local* time, so
# a file saved in the evening carries the date you remember saving it. The model is never
# asked for them and cannot override them: it is never told the file's date, so
# a date it supplied would be one it made up.
#
# Every other `{token}` comes from the model's name_tokens. One it does not
# supply sends the file to review rather than filing it under a name with a
# hole in it. Syntax is provisional -- see ADR-0001, Open Questions.
template = "{date}-{doc_type}-{vendor}{ext}"

[profiles.metadata]
detect_mime = true
extract_pdf_metadata = true
content_sniff_bytes = 4000
