# Bowerbird model-comparison lab.
#
# One profile per model, each scanning its *own copy* of the corpus, all
# sharing one state database. The journal's `profile` column is what makes the
# comparison possible: every committed row carries the model that proposed it,
# its confidence, and the directory it chose.
#
# Generated by `scripts/lab.sh init`. Edit freely -- it is gitignored, and
# `init` will not overwrite it without --force.

config_version = 1

[general]
# The lab always executes, because a dry run writes no journal rows and the
# journal is where the comparison comes from. Every profile scans a disposable
# copy, never your originals.
dry_run = false
state_path = "__LAB__/state.db"
lock_file_dir = "__LAB__/locks"
quarantine_dir = "__LAB__/quarantine"
log_level = "warn"
review_placement = "in_place"


# --- Backends -----------------------------------------------------------------

[[llm_backends]]
name = "qwen3b"
provider = "openai_compatible"
endpoint = "https://ai.internal.oreillys.io/v1"
api_key_env = ""
model = "/models/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
# A 3B model on a shared endpoint answers at roughly 15s per file, so the
# generous timeout is not paranoia. See batch_size on the profiles: the batch,
# not the timeout, is the thing to tune first.
timeout_secs = 300
max_retries = 1
structured_output = "prompt"

# Export the key in your shell; it is never stored here.
#     export OPENAI_API_KEY=...
# Delete this backend and its profile below if you do not want to use it.
[[llm_backends]]
name = "gpt"
provider = "openai_compatible"
endpoint = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4o-mini"
timeout_secs = 60
max_retries = 2
# A cloud endpoint that does support response_format, so this exercises a
# stronger path than the local server's "prompt".
structured_output = "json_schema"


# --- One profile per thing you are comparing ----------------------------------
#
# A profile is a column in `lab.sh compare`, so it does not have to be a model.
# To measure a *setting*, add a profile pointing at the same backend and change
# one thing:
#
#     [[profiles]]
#     name = "qwen3b-sniff"                      # a new column
#     path = "__LAB__/runs/qwen3b-sniff/inbox"   # its own copy of the corpus
#     destination_root = "__LAB__/runs/qwen3b-sniff/organized"
#     llm_backend = "qwen3b"                     # same model
#     ...
#     [profiles.metadata]
#     content_sniff_bytes = 4000                 # the one difference
#
# Vary exactly one thing per profile. Two differences and the column tells you
# nothing about either.
#
# `name` must match the run directory under __LAB__/runs/.

[[profiles]]
name = "qwen3b"
path = "__LAB__/runs/qwen3b/inbox"
destination_root = "__LAB__/runs/qwen3b/organized"
description = "__DESCRIPTION__"
enabled = true
llm_backend = "qwen3b"
categories = __CATEGORIES__
allow_dynamic_categories = false
allow_delete_suggestions = false
# Small on purpose. One request per few files gives each its own timeout
# budget, so a slow model degrades into "this takes a while" instead of
# "everything failed". The default of 25 assumes a fast endpoint.
batch_size = 4
confidence_threshold = 0.75
on_conflict = "quarantine"
stability_wait_minutes = 0
exclude_patterns = []
include_subdirs = false

[profiles.rename]
enabled = false

[profiles.metadata]
detect_mime = true
extract_exif = false
extract_audio_tags = false
extract_pdf_metadata = false
# 0 discloses no file content. Raise it and the first N bytes of each file
# reach whichever backend that profile routes to -- including the cloud one.
# Change it in every profile at once, or the comparison is measuring inputs
# rather than models.
content_sniff_bytes = 0

[[profiles]]
name = "gpt"
path = "__LAB__/runs/gpt/inbox"
destination_root = "__LAB__/runs/gpt/organized"
description = "__DESCRIPTION__"
enabled = true
llm_backend = "gpt"
categories = __CATEGORIES__
allow_dynamic_categories = false
allow_delete_suggestions = false
# Small on purpose. One request per few files gives each its own timeout
# budget, so a slow model degrades into "this takes a while" instead of
# "everything failed". The default of 25 assumes a fast endpoint.
batch_size = 4
confidence_threshold = 0.75
on_conflict = "quarantine"
stability_wait_minutes = 0
exclude_patterns = []
include_subdirs = false

[profiles.rename]
enabled = false

[profiles.metadata]
detect_mime = true
extract_exif = false
extract_audio_tags = false
extract_pdf_metadata = false
content_sniff_bytes = 0
